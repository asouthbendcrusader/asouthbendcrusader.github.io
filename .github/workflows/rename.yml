name: Rename dossier to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename dossier file to index.html
        run: |
          if [ -f index.html ]; then echo "index.html already exists"; exit 0; fi
          git mv the-shawn-apps-file.html index.html
          git config user.name "asouthbendcrusader"
          git config user.email "waynehubbard321@gmail.com"
          git commit -m "Rename dossier file to index.html"
          git push
