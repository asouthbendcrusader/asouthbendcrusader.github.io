name: Replace Apps page with counter version
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace Apps page
        run: |
          set -e
          test -f tmp-apps/index.html
          cp tmp-apps/index.html index.html
          rm -rf tmp-apps
          git config user.name "asouthbendcrusader"
          git config user.email "asouthbendcrusader@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Replace Apps page with counter version"
          git push
